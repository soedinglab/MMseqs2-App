name: Release Foldseek MCP runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immutable assets for the existing mcp-v<version> tag"
        required: true
        default: false
        type: boolean

concurrency:
  group: mcp-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify the MCP tag and package version
        id: version
        run: |
          version=$(node -p "require('./mcp/server/package.json').version")
          tag="mcp-v${version}"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} must equal $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test the MCP server
        run: npm test --workspace mcp/server

      - name: Build the minimal plugin runtime
        run: npm run build:plugin-runtime --workspace mcp/server

      - name: Write the artifact checksum
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="foldseek-server-plugin-runtime-v${VERSION}.zip"
          cd mcp/server/dist
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=mcp/server/dist/$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=mcp/server/dist/$asset.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: foldseek-server-plugin-runtime-v${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.asset }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable assets on an MCP tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.artifact.outputs.asset }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published-mcp-runtime"
            gh release download "$TAG" --dir "$RUNNER_TEMP/published-mcp-runtime" \
              --pattern "$(basename "$ASSET")" --pattern "$(basename "$CHECKSUM")"
            cmp "$ASSET" "$RUNNER_TEMP/published-mcp-runtime/$(basename "$ASSET")"
            cmp "$CHECKSUM" "$RUNNER_TEMP/published-mcp-runtime/$(basename "$CHECKSUM")"
            echo "$TAG already carries these exact immutable assets"
          else
            gh release create "$TAG" "$ASSET" "$CHECKSUM" --verify-tag \
              --title "Foldseek MCP server v${VERSION}" \
              --notes "Minimal self-contained runtime for the Foldseek Claude plugin. The Desktop MCPB is distributed separately."
          fi
